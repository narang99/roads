[project]
name = "mtrain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "narang99", email = "hariom2711@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "blur-detector>=0.0.6",
    "cachetools>=6.2.4",
    "clip",
    "datasets>=4.5.0",
    "einops>=0.8.2",
    "evaluate>=0.4.6",
    "fastai>=2.8.6",
    "fastprogress>=1.1.3",
    "fiftyone>=1.11.1",
    "ftfy>=6.3.1",
    "grad-cam>=1.5.5",
    "ipykernel>=7.1.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyter-contrib-nbextensions>=0.7.0",
    "jupyternotify>=0.1.15",
    "label-studio-converter>=0.0.59",
    "plotly>=6.5.2",
    "pycocotools>=2.0.11",
    "pyinaturalist>=0.21.1",
    "pytest>=9.0.2",
    "regex>=2026.1.15",
    "scikit-learn>=1.8.0",
    "timm>=1.0.25",
    "tqdm>=4.67.1",
    "transformers[torch]>=4.57.6",
    "ultralytics>=8.4.6",
]

[project.scripts]
mtrain = "mtrain:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }
